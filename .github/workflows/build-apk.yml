<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>build-apk.yml</title>
<style>
:root{--bg:#f3f5f7;--fg:#1b1f24;--card:#fff;--pri:#2c6e69}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--fg:#e6e8eb;--card:#1d2328;--pri:#4a8a84}}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
button{width:100%;padding:14px;font-size:16px;border:0;border-radius:12px;background:var(--pri);color:#fff;margin-bottom:10px}
p{margin:0 0 10px;font-size:14px}
textarea{width:100%;box-sizing:border-box;height:70vh;direction:ltr;text-align:left;font:12px/1.5 monospace;background:var(--card);color:var(--fg);border:1px solid #8884;border-radius:10px;padding:10px}
</style></head><body>
<button id="b">نسخ الملف كاملًا</button>
<p id="m">المسار في المستودع: .github/workflows/build-apk.yml</p>
<textarea id="t" readonly>name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Show resolved library versions
        run: npm ls --depth=0

      - name: Add Android platform
        run: npx cap add android

      - name: Status bar icons follow day/night
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values $R/values-night
          printf &#x27;&lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&gt;\n&lt;resources&gt;\n    &lt;bool name=&quot;work_light_bars&quot;&gt;true&lt;/bool&gt;\n&lt;/resources&gt;\n&#x27; &gt; $R/values/work_bool.xml
          printf &#x27;&lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&gt;\n&lt;resources&gt;\n    &lt;bool name=&quot;work_light_bars&quot;&gt;false&lt;/bool&gt;\n&lt;/resources&gt;\n&#x27; &gt; $R/values-night/work_bool.xml
          sed -i &#x27;s#\(&lt;style name=&quot;AppTheme.NoActionBar&quot;[^&gt;]*&gt;\)#\1\n        &lt;item name=&quot;android:windowLightStatusBar&quot;&gt;@bool/work_light_bars&lt;/item&gt;\n        &lt;item name=&quot;android:windowLightNavigationBar&quot;&gt;@bool/work_light_bars&lt;/item&gt;#&#x27; $R/values/styles.xml

      - name: App icons (2 styles x 8 colors, switchable)
        run: |
          pip install --break-system-packages pillow
          python3 android-src/gen_icons.py
          P=android/app/src/main/java/com/pd/earnings
          mkdir -p $P
          cp android-src/AppIconPlugin.java $P/

      - name: Folder picker plugin (SAF)
        run: |
          P=android/app/src/main/java/com/pd/earnings
          mkdir -p $P
          cp android-src/SafBackupPlugin.java $P/
          sed -i &#x27;/^dependencies {/a\    implementation &quot;androidx.documentfile:documentfile:1.0.1&quot;&#x27; android/app/build.gradle

      - name: Fingerprint lock + home-screen widget
        run: |
          P=android/app/src/main/java/com/pd/earnings
          R=android/app/src/main/res
          mkdir -p $P $R/layout $R/drawable $R/xml
          cp android-src/BioPlugin.java $P/
          cp android-src/WorkWidgetProvider.java $P/
          cp android-src/WorkWidgetPlugin.java $P/
          cp android-src/MainActivity.java $P/
          cp android-src/work_widget.xml $R/layout/
          cp android-src/work_widget_bg.xml $R/drawable/
          cp android-src/work_widget_bg_on.xml $R/drawable/
          cp android-src/work_w_play.xml $R/drawable/
          cp android-src/work_w_stop.xml $R/drawable/
          cp android-src/work_w_check.xml $R/drawable/
          cp android-src/work_widget_info.xml $R/xml/
          M=android/app/src/main/AndroidManifest.xml
          sed -i &#x27;s#&lt;/application&gt;#    &lt;receiver android:name=&quot;.WorkWidgetProvider&quot; android:exported=&quot;true&quot;&gt;&lt;intent-filter&gt;&lt;action android:name=&quot;android.appwidget.action.APPWIDGET_UPDATE&quot;/&gt;&lt;/intent-filter&gt;&lt;meta-data android:name=&quot;android.appwidget.provider&quot; android:resource=&quot;@xml/work_widget_info&quot;/&gt;&lt;/receiver&gt;\n    &lt;/application&gt;#&#x27; $M
          grep -q &#x27;WorkWidgetProvider&#x27; $M || { echo &quot;widget receiver was not added to the manifest&quot;; exit 1; }
          sed -i &#x27;/^dependencies {/a\    implementation &quot;androidx.biometric:biometric:1.1.0&quot;&#x27; android/app/build.gradle
          grep -q &#x27;androidx.biometric&#x27; android/app/build.gradle || { echo &quot;biometric dependency was not added&quot;; exit 1; }

      - name: Android 16 (API 36) + arm64 only + storage permissions
        run: |
          sed -i &#x27;s/targetSdkVersion = .*/targetSdkVersion = 36/&#x27; android/variables.gradle
          sed -i &#x27;/defaultConfig {/a\        ndk { abiFilters &quot;arm64-v8a&quot; }&#x27; android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i &#x27;s#&lt;application#&lt;uses-permission android:name=&quot;android.permission.READ_EXTERNAL_STORAGE&quot; android:maxSdkVersion=&quot;32&quot;/&gt;\n    &lt;uses-permission android:name=&quot;android.permission.WRITE_EXTERNAL_STORAGE&quot; android:maxSdkVersion=&quot;29&quot;/&gt;\n    &lt;application#&#x27; $M
          sed -i &#x27;s#&lt;application#&lt;application android:requestLegacyExternalStorage=&quot;true&quot;#&#x27; $M

      - name: Version number (changes with every build)
        env:
          N: ${{ github.run_number }}
        run: |
          G=android/app/build.gradle
          sed -i &quot;s/versionCode [0-9][0-9]*/versionCode $N/; s/versionName \&quot;[^\&quot;]*\&quot;/versionName \&quot;2.0.$N\&quot;/&quot; $G
          grep -q &quot;versionCode $N\$&quot; $G || { echo &quot;versionCode was not updated&quot;; exit 1; }
          grep -q &quot;versionName \&quot;2.0.$N\&quot;&quot; $G || { echo &quot;versionName was not updated&quot;; exit 1; }
          echo &quot;Version: 2.0.$N (code $N)&quot;

      - name: Sync web assets
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.KS_PASSWORD || &#x27;workpass123&#x27; }}
          KEY_ALIAS_IN: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS || secrets.ALIAS }}
          KEY_PASS_IN: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n &quot;$KS_B64&quot; ]; then
            echo &quot;Keystore source: repository secret&quot;
            echo &quot;$KS_B64&quot; | tr -d &#x27; \r\n&#x27; | base64 -d &gt; work.p12 || { echo &quot;::error::The keystore secret is not valid base64&quot;; exit 1; }
          else
            echo &quot;::warning::No keystore secret found. Using a temporary key, so every update needs an uninstall first.&quot;
            keytool -genkeypair -keystore work.p12 -storetype pkcs12 -alias work -keyalg RSA -keysize 2048 -validity 10000 -storepass &quot;$KS_PASS&quot; -keypass &quot;$KS_PASS&quot; -dname &quot;CN=Work App&quot;
            KEY_ALIAS_IN=work
            KEY_PASS_IN=
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          ARGS=(--ks work.p12 --ks-pass env:KS_PASS)
          if [ -n &quot;$KEY_ALIAS_IN&quot; ]; then ARGS+=(--ks-key-alias &quot;$KEY_ALIAS_IN&quot;); fi
          if [ -n &quot;$KEY_PASS_IN&quot; ]; then ARGS+=(--key-pass env:KEY_PASS_IN); fi
          $BT/apksigner sign &quot;${ARGS[@]}&quot; --out work-release.apk aligned.apk
          $BT/apksigner verify work-release.apk
          echo &quot;Signed OK&quot;

      - name: Name the APK by version
        env:
          N: ${{ github.run_number }}
        run: mv work-release.apk &quot;work-v2.0.$N.apk&quot;

      - uses: actions/upload-artifact@v4
        with:
          name: work-v2.0.${{ github.run_number }}
          path: work-v2.0.${{ github.run_number }}.apk
</textarea>
<script>
document.getElementById('b').onclick=async function(){
var t=document.getElementById('t'),m=document.getElementById('m');
try{await navigator.clipboard.writeText(t.value);m.textContent='تم النسخ ✓'}
catch(e){t.focus();t.select();t.setSelectionRange(0,t.value.length);
try{document.execCommand('copy');m.textContent='تم النسخ ✓'}catch(e2){m.textContent='حدّد النص واضغط نسخ يدويًا'}}
};
</script></body></html>