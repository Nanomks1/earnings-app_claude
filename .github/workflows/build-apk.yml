name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Status bar icons follow day/night
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values $R/values-night
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <bool name="work_light_bars">true</bool>\n</resources>\n' > $R/values/work_bool.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <bool name="work_light_bars">false</bool>\n</resources>\n' > $R/values-night/work_bool.xml
          sed -i 's#\(<style name="AppTheme.NoActionBar"[^>]*>\)#\1\n        <item name="android:windowLightStatusBar">@bool/work_light_bars</item>\n        <item name="android:windowLightNavigationBar">@bool/work_light_bars</item>#' $R/values/styles.xml

      - name: Phone repair icon
        run: |
          pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import os
          res = 'android/app/src/main/res'
          TEAL = (44, 110, 105, 255)
          W = (255, 255, 255, 255)

          def draw(size, circle, scale):
              S = size * 4
              B = S * scale
              im = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              if circle:
                  d.ellipse([0, 0, S - 1, S - 1], fill=TEAL)
              c = S / 2
              pw, ph, sw = B * 0.50, B * 0.84, max(2, int(B * 0.065))
              px, py = c - B * 0.07, c
              d.rounded_rectangle([px - pw / 2, py - ph / 2, px + pw / 2, py + ph / 2], radius=B * 0.10, outline=W, width=sw)
              d.ellipse([px - B * 0.035, py + ph / 2 - B * 0.13, px + B * 0.035, py + ph / 2 - B * 0.06], fill=W)
              d.line([px - B * 0.07, py - ph / 2 + B * 0.09, px + B * 0.07, py - ph / 2 + B * 0.09], fill=W, width=max(2, int(sw * 0.7)))
              L = Image.new('L', (S, S), 0)
              wd = ImageDraw.Draw(L)
              hh = B * 0.055
              wd.rounded_rectangle([c - B * 0.46, c - hh, c + B * 0.12, c + hh], radius=hh, fill=255)
              hx, hr = c + B * 0.20, B * 0.17
              wd.ellipse([hx - hr, c - hr, hx + hr, c + hr], fill=255)
              wd.rectangle([hx + B * 0.02, c - B * 0.075, hx + hr + 4, c + B * 0.075], fill=0)
              L = L.rotate(45, resample=Image.BICUBIC, center=(c, c))
              shift = (int(B * 0.13), int(B * 0.1))
              L = L.transform(L.size, Image.AFFINE, (1, 0, -shift[0], 0, 1, -shift[1]))
              halo = L.filter(ImageFilter.MaxFilter(int(B * 0.06) // 2 * 2 + 1))
              im.paste(Image.new('RGBA', (S, S), TEAL), (0, 0), halo)
              im.paste(Image.new('RGBA', (S, S), W), (0, 0), L)
              return im.resize((size, size), Image.LANCZOS)

          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          fg = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          for k, s in legacy.items():
              d = f'{res}/mipmap-{k}'
              os.makedirs(d, exist_ok=True)
              img = draw(s, True, 0.56)
              img.save(f'{d}/ic_launcher.png')
              img.save(f'{d}/ic_launcher_round.png')
          for k, s in fg.items():
              d = f'{res}/mipmap-{k}'
              os.makedirs(d, exist_ok=True)
              draw(s, False, 0.50).save(f'{d}/work_fg.png')

          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/work_icon_bg"/>\n    <foreground android:drawable="@mipmap/work_fg"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w').write(xml)
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/work_icon.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="work_icon_bg">#2C6E69</color>\n</resources>\n')
          PY

      - name: Folder picker plugin (SAF)
        run: |
          P=android/app/src/main/java/com/pd/earnings
          mkdir -p $P
          cat > $P/SafBackupPlugin.java <<'JAVA'
          package com.pd.earnings;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.activity.result.ActivityResult;
          import androidx.documentfile.provider.DocumentFile;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "SafBackup")
          public class SafBackupPlugin extends Plugin {

              @PluginMethod
              public void pickFolder(PluginCall call) {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                          | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                  startActivityForResult(call, intent, "pickFolderResult");
              }

              @ActivityCallback
              private void pickFolderResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                      call.reject("cancelled");
                      return;
                  }
                  try {
                      Uri uri = result.getData().getData();
                      getContext().getContentResolver().takePersistableUriPermission(uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), uri);
                      String name = (dir != null && dir.getName() != null) ? dir.getName() : "";
                      JSObject o = new JSObject();
                      o.put("uri", uri.toString());
                      o.put("name", name);
                      call.resolve(o);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void writeFile(PluginCall call) {
                  try {
                      String tree = call.getString("tree");
                      String name = call.getString("name");
                      String data = call.getString("data");
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(tree));
                      if (dir == null || !dir.canWrite()) {
                          call.reject("no access");
                          return;
                      }
                      DocumentFile f = dir.findFile(name);
                      if (f == null) f = dir.createFile("application/json", name);
                      if (f == null) {
                          call.reject("create failed");
                          return;
                      }
                      OutputStream os = getContext().getContentResolver().openOutputStream(f.getUri(), "wt");
                      if (os == null) {
                          call.reject("open failed");
                          return;
                      }
                      try {
                          os.write(data.getBytes(StandardCharsets.UTF_8));
                      } finally {
                          os.close();
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void listFiles(PluginCall call) {
                  try {
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(call.getString("tree")));
                      if (dir == null || !dir.canWrite()) {
                          call.reject("no access");
                          return;
                      }
                      JSArray arr = new JSArray();
                      DocumentFile[] files = dir.listFiles();
                      for (DocumentFile f : files) {
                          String n = f.getName();
                          if (f.isFile() && n != null && n.toLowerCase().endsWith(".json")) {
                              JSObject o = new JSObject();
                              o.put("name", n);
                              o.put("uri", f.getUri().toString());
                              o.put("modified", f.lastModified());
                              arr.put(o);
                          }
                      }
                      JSObject res = new JSObject();
                      res.put("files", arr);
                      call.resolve(res);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void readFile(PluginCall call) {
                  try {
                      String uri = call.getString("uri");
                      if (uri == null) {
                          DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(call.getString("tree")));
                          DocumentFile f = dir == null ? null : dir.findFile(call.getString("name"));
                          if (f == null) {
                              call.reject("not found");
                              return;
                          }
                          uri = f.getUri().toString();
                      }
                      InputStream is = getContext().getContentResolver().openInputStream(Uri.parse(uri));
                      if (is == null) {
                          call.reject("open failed");
                          return;
                      }
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      try {
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = is.read(buf)) > 0) bos.write(buf, 0, n);
                      } finally {
                          is.close();
                      }
                      JSObject res = new JSObject();
                      res.put("data", new String(bos.toByteArray(), StandardCharsets.UTF_8));
                      call.resolve(res);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          cat > $P/MainActivity.java <<'JAVA'
          package com.pd.earnings;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SafBackupPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i '/^dependencies {/a\    implementation "androidx.documentfile:documentfile:1.0.1"' android/app/build.gradle

      - name: Android 16 (API 36) + arm64 only + storage permissions
        run: |
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          sed -i '/defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application#' $M
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M

      - name: Sync web assets
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.KS_PASSWORD || 'workpass123' }}
          KEY_ALIAS_IN: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS || secrets.ALIAS }}
          KEY_PASS_IN: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "Keystore source: repository secret"
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > work.p12 || { echo "::error::The keystore secret is not valid base64"; exit 1; }
          else
            echo "::warning::No keystore secret found. Using a temporary key, so every update needs an uninstall first."
            keytool -genkeypair -keystore work.p12 -storetype pkcs12 -alias work -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Work App"
            KEY_ALIAS_IN=work
            KEY_PASS_IN=
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          ARGS=(--ks work.p12 --ks-pass env:KS_PASS)
          if [ -n "$KEY_ALIAS_IN" ]; then ARGS+=(--ks-key-alias "$KEY_ALIAS_IN"); fi
          if [ -n "$KEY_PASS_IN" ]; then ARGS+=(--key-pass env:KEY_PASS_IN); fi
          $BT/apksigner sign "${ARGS[@]}" --out work-release.apk aligned.apk
          $BT/apksigner verify work-release.apk
          echo "Signed OK"

      - uses: actions/upload-artifact@v4
        with:
          name: work-apk-release
          path: work-release.apk
