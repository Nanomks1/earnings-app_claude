name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Show resolved library versions
        run: npm ls --depth=0

      - name: Add Android platform
        run: npx cap add android

      - name: Status bar icons follow day/night
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values $R/values-night
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <bool name="work_light_bars">true</bool>\n</resources>\n' > $R/values/work_bool.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <bool name="work_light_bars">false</bool>\n</resources>\n' > $R/values-night/work_bool.xml
          sed -i 's#\(<style name="AppTheme.NoActionBar"[^>]*>\)#\1\n        <item name="android:windowLightStatusBar">@bool/work_light_bars</item>\n        <item name="android:windowLightNavigationBar">@bool/work_light_bars</item>#' $R/values/styles.xml

      - name: Phone repair icon
        run: |
          pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import os
          res = 'android/app/src/main/res'
          TEAL = (44, 110, 105, 255)
          W = (255, 255, 255, 255)

          def draw(size, circle, scale):
              S = size * 4
              B = S * scale
              im = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              if circle:
                  d.ellipse([0, 0, S - 1, S - 1], fill=TEAL)
              c = S / 2
              pw, ph, sw = B * 0.50, B * 0.84, max(2, int(B * 0.065))
              px, py = c - B * 0.07, c
              d.rounded_rectangle([px - pw / 2, py - ph / 2, px + pw / 2, py + ph / 2], radius=B * 0.10, outline=W, width=sw)
              d.ellipse([px - B * 0.035, py + ph / 2 - B * 0.13, px + B * 0.035, py + ph / 2 - B * 0.06], fill=W)
              d.line([px - B * 0.07, py - ph / 2 + B * 0.09, px + B * 0.07, py - ph / 2 + B * 0.09], fill=W, width=max(2, int(sw * 0.7)))
              L = Image.new('L', (S, S), 0)
              wd = ImageDraw.Draw(L)
              hh = B * 0.055
              wd.rounded_rectangle([c - B * 0.46, c - hh, c + B * 0.12, c + hh], radius=hh, fill=255)
              hx, hr = c + B * 0.20, B * 0.17
              wd.ellipse([hx - hr, c - hr, hx + hr, c + hr], fill=255)
              wd.rectangle([hx + B * 0.02, c - B * 0.075, hx + hr + 4, c + B * 0.075], fill=0)
              L = L.rotate(45, resample=Image.BICUBIC, center=(c, c))
              shift = (int(B * 0.13), int(B * 0.1))
              L = L.transform(L.size, Image.AFFINE, (1, 0, -shift[0], 0, 1, -shift[1]))
              halo = L.filter(ImageFilter.MaxFilter(int(B * 0.06) // 2 * 2 + 1))
              im.paste(Image.new('RGBA', (S, S), TEAL), (0, 0), halo)
              im.paste(Image.new('RGBA', (S, S), W), (0, 0), L)
              return im.resize((size, size), Image.LANCZOS)

          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          fg = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          for k, s in legacy.items():
              d = f'{res}/mipmap-{k}'
              os.makedirs(d, exist_ok=True)
              img = draw(s, True, 0.56)
              img.save(f'{d}/ic_launcher.png')
              img.save(f'{d}/ic_launcher_round.png')
          for k, s in fg.items():
              d = f'{res}/mipmap-{k}'
              os.makedirs(d, exist_ok=True)
              draw(s, False, 0.50).save(f'{d}/work_fg.png')

          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/work_icon_bg"/>\n    <foreground android:drawable="@mipmap/work_fg"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w').write(xml)
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/work_icon.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="work_icon_bg">#2C6E69</color>\n</resources>\n')
          PY

      - name: Folder picker plugin (SAF)
        run: |
          P=android/app/src/main/java/com/pd/earnings
          mkdir -p $P
          cat > $P/SafBackupPlugin.java <<'JAVA'
          package com.pd.earnings;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.activity.result.ActivityResult;
          import androidx.documentfile.provider.DocumentFile;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "SafBackup")
          public class SafBackupPlugin extends Plugin {

              @PluginMethod
              public void pickFolder(PluginCall call) {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                          | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                  startActivityForResult(call, intent, "pickFolderResult");
              }

              @ActivityCallback
              private void pickFolderResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                      call.reject("cancelled");
                      return;
                  }
                  try {
                      Uri uri = result.getData().getData();
                      getContext().getContentResolver().takePersistableUriPermission(uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), uri);
                      String name = (dir != null && dir.getName() != null) ? dir.getName() : "";
                      JSObject o = new JSObject();
                      o.put("uri", uri.toString());
                      o.put("name", name);
                      call.resolve(o);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void writeFile(PluginCall call) {
                  try {
                      String tree = call.getString("tree");
                      String name = call.getString("name");
                      String data = call.getString("data");
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(tree));
                      if (dir == null || !dir.canWrite()) {
                          call.reject("no access");
                          return;
                      }
                      DocumentFile f = dir.findFile(name);
                      if (f == null) f = dir.createFile("application/json", name);
                      if (f == null) {
                          call.reject("create failed");
                          return;
                      }
                      OutputStream os = getContext().getContentResolver().openOutputStream(f.getUri(), "wt");
                      if (os == null) {
                          call.reject("open failed");
                          return;
                      }
                      try {
                          os.write(data.getBytes(StandardCharsets.UTF_8));
                      } finally {
                          os.close();
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void listFiles(PluginCall call) {
                  try {
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(call.getString("tree")));
                      if (dir == null || !dir.canWrite()) {
                          call.reject("no access");
                          return;
                      }
                      JSArray arr = new JSArray();
                      DocumentFile[] files = dir.listFiles();
                      for (DocumentFile f : files) {
                          String n = f.getName();
                          if (f.isFile() && n != null && n.toLowerCase().endsWith(".json")) {
                              JSObject o = new JSObject();
                              o.put("name", n);
                              o.put("uri", f.getUri().toString());
                              o.put("modified", f.lastModified());
                              arr.put(o);
                          }
                      }
                      JSObject res = new JSObject();
                      res.put("files", arr);
                      call.resolve(res);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void readFile(PluginCall call) {
                  try {
                      String uri = call.getString("uri");
                      if (uri == null) {
                          DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(call.getString("tree")));
                          DocumentFile f = dir == null ? null : dir.findFile(call.getString("name"));
                          if (f == null) {
                              call.reject("not found");
                              return;
                          }
                          uri = f.getUri().toString();
                      }
                      InputStream is = getContext().getContentResolver().openInputStream(Uri.parse(uri));
                      if (is == null) {
                          call.reject("open failed");
                          return;
                      }
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      try {
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = is.read(buf)) > 0) bos.write(buf, 0, n);
                      } finally {
                          is.close();
                      }
                      JSObject res = new JSObject();
                      res.put("data", new String(bos.toByteArray(), StandardCharsets.UTF_8));
                      call.resolve(res);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          cat > $P/MainActivity.java <<'JAVA'
          package com.pd.earnings;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SafBackupPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i '/^dependencies {/a\    implementation "androidx.documentfile:documentfile:1.0.1"' android/app/build.gradle

      - name: Fingerprint lock + home-screen widget
        run: |
          P=android/app/src/main/java/com/pd/earnings
          R=android/app/src/main/res
          mkdir -p $P $R/layout $R/drawable $R/xml
          cat > $P/BioPlugin.java <<'JAVA'
          package com.pd.earnings;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Bio")
          public class BioPlugin extends Plugin {
              private static final int AUTH = BiometricManager.Authenticators.BIOMETRIC_STRONG
                      | BiometricManager.Authenticators.BIOMETRIC_WEAK;

              @PluginMethod
              public void available(PluginCall call) {
                  int r = BiometricManager.from(getContext()).canAuthenticate(AUTH);
                  JSObject o = new JSObject();
                  o.put("ok", r == BiometricManager.BIOMETRIC_SUCCESS);
                  call.resolve(o);
              }

              @PluginMethod
              public void authenticate(final PluginCall call) {
                  final AppCompatActivity a = getActivity();
                  if (a == null) {
                      call.reject("no activity");
                      return;
                  }
                  a.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                                      .setTitle("العمل")
                                      .setSubtitle("افتح التطبيق بالبصمة")
                                      .setNegativeButtonText("استعمال الرمز")
                                      .setAllowedAuthenticators(AUTH)
                                      .build();
                              BiometricPrompt bp = new BiometricPrompt(a, ContextCompat.getMainExecutor(a),
                                      new BiometricPrompt.AuthenticationCallback() {
                                          @Override
                                          public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                              call.resolve();
                                          }

                                          @Override
                                          public void onAuthenticationError(int code, CharSequence msg) {
                                              call.reject(String.valueOf(msg));
                                          }
                                      });
                              bp.authenticate(info);
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  });
              }
          }
          JAVA
          cat > $P/WorkWidgetProvider.java <<'JAVA'
          package com.pd.earnings;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          public class WorkWidgetProvider extends AppWidgetProvider {
              static final String ACT = "com.pd.earnings.WIDGET_TOGGLE";

              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("work_widget", Context.MODE_PRIVATE);
              }

              static String fmt(String pattern, long t) {
                  return new SimpleDateFormat(pattern, Locale.US).format(new Date(t));
              }

              static void toggle(Context c) {
                  synchronized (WorkWidgetProvider.class) {
                      SharedPreferences p = prefs(c);
                      long now = System.currentTimeMillis();
                      JSONArray ev;
                      try {
                          ev = new JSONArray(p.getString("events", "[]"));
                      } catch (JSONException e) {
                          ev = new JSONArray();
                      }
                      try {
                          JSONObject o = new JSONObject();
                          SharedPreferences.Editor ed = p.edit();
                          if (p.getBoolean("open", false)) {
                              o.put("t", "out");
                              o.put("date", p.getString("date", ""));
                              o.put("start", p.getString("start", ""));
                              o.put("startTs", p.getLong("startTs", now));
                              o.put("end", fmt("HH:mm", now));
                              o.put("endTs", now);
                              ed.putBoolean("open", false);
                          } else {
                              o.put("t", "in");
                              o.put("date", fmt("yyyy-MM-dd", now));
                              o.put("start", fmt("HH:mm", now));
                              o.put("startTs", now);
                              ed.putBoolean("open", true);
                              ed.putString("date", fmt("yyyy-MM-dd", now));
                              ed.putString("start", fmt("HH:mm", now));
                              ed.putLong("startTs", now);
                          }
                          ev.put(o);
                          ed.putString("events", ev.toString());
                          ed.commit();
                      } catch (JSONException e) {
                          // لا شيء
                      }
                  }
              }

              static void draw(Context c, AppWidgetManager m, int id) {
                  SharedPreferences p = prefs(c);
                  boolean open = p.getBoolean("open", false);
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.work_widget);
                  v.setTextViewText(R.id.work_w_title, open ? "تسجيل الخروج" : "تسجيل الدخول");
                  v.setTextViewText(R.id.work_w_sub, open ? "دخلت " + p.getString("start", "") : "اضغط عند وصولك للعمل");
                  v.setImageViewResource(R.id.work_w_icon, open ? R.drawable.work_w_stop : R.drawable.work_w_play);
                  Intent i = new Intent(c, WorkWidgetProvider.class);
                  i.setAction(ACT);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 0, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  v.setOnClickPendingIntent(R.id.work_w_root, pi);
                  m.updateAppWidget(id, v);
              }

              static void refreshAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  int[] ids = m.getAppWidgetIds(new ComponentName(c, WorkWidgetProvider.class));
                  for (int id : ids) draw(c, m, id);
              }

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) draw(c, m, id);
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  super.onReceive(c, i);
                  if (i != null && ACT.equals(i.getAction())) {
                      toggle(c);
                      refreshAll(c);
                  }
              }
          }
          JAVA
          cat > $P/WorkWidgetPlugin.java <<'JAVA'
          package com.pd.earnings;

          import android.content.SharedPreferences;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONException;

          @CapacitorPlugin(name = "WorkWidget")
          public class WorkWidgetPlugin extends Plugin {

              @PluginMethod
              public void takeEvents(PluginCall call) {
                  synchronized (WorkWidgetProvider.class) {
                      SharedPreferences p = WorkWidgetProvider.prefs(getContext());
                      JSArray arr;
                      try {
                          arr = new JSArray(p.getString("events", "[]"));
                      } catch (JSONException e) {
                          arr = new JSArray();
                      }
                      p.edit().putString("events", "[]").commit();
                      JSObject o = new JSObject();
                      o.put("events", arr);
                      call.resolve(o);
                  }
              }

              @PluginMethod
              public void setOpen(PluginCall call) {
                  synchronized (WorkWidgetProvider.class) {
                      SharedPreferences.Editor e = WorkWidgetProvider.prefs(getContext()).edit();
                      boolean open = Boolean.TRUE.equals(call.getBoolean("open", false));
                      e.putBoolean("open", open);
                      if (open) {
                          Double ts = call.getDouble("ts");
                          e.putString("date", call.getString("date", ""));
                          e.putString("start", call.getString("start", ""));
                          e.putLong("startTs", ts == null ? System.currentTimeMillis() : ts.longValue());
                      }
                      e.commit();
                  }
                  WorkWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }
          }
          JAVA
          cat > $P/MainActivity.java <<'JAVA'
          package com.pd.earnings;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SafBackupPlugin.class);
                  registerPlugin(BioPlugin.class);
                  registerPlugin(WorkWidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          cat > $R/layout/work_widget.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/work_w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:padding="12dp"
              android:background="@drawable/work_widget_bg">
              <ImageView
                  android:id="@+id/work_w_icon"
                  android:layout_width="28dp"
                  android:layout_height="28dp"
                  android:src="@drawable/work_w_play" />
              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:layout_marginStart="10dp"
                  android:orientation="vertical">
                  <TextView
                      android:id="@+id/work_w_title"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:maxLines="1"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/work_w_sub"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:maxLines="1"
                      android:textColor="#CCFFFFFF"
                      android:textSize="12sp" />
              </LinearLayout>
          </LinearLayout>
          XML
          cat > $R/drawable/work_widget_bg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#2C6E69" />
              <corners android:radius="24dp" />
          </shape>
          XML
          cat > $R/drawable/work_w_play.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M8,5.5L18.5,12L8,18.5Z" />
          </vector>
          XML
          cat > $R/drawable/work_w_stop.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M7,7L17,7L17,17L7,17Z" />
          </vector>
          XML
          cat > $R/xml/work_widget_info.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="40dp"
              android:targetCellWidth="2"
              android:targetCellHeight="1"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/work_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          XML
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <receiver android:name=".WorkWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/work_widget_info"/></receiver>\n    </application>#' $M
          grep -q 'WorkWidgetProvider' $M || { echo "widget receiver was not added to the manifest"; exit 1; }
          sed -i '/^dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' android/app/build.gradle
          grep -q 'androidx.biometric' android/app/build.gradle || { echo "biometric dependency was not added"; exit 1; }

      - name: Android 16 (API 36) + arm64 only + storage permissions
        run: |
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          sed -i '/defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application#' $M
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M

      - name: Version number (changes with every build)
        env:
          N: ${{ github.run_number }}
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9][0-9]*/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.0.$N\"/" $G
          grep -q "versionCode $N\$" $G || { echo "versionCode was not updated"; exit 1; }
          grep -q "versionName \"1.0.$N\"" $G || { echo "versionName was not updated"; exit 1; }
          echo "Version: 1.0.$N (code $N)"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.KS_PASSWORD || 'workpass123' }}
          KEY_ALIAS_IN: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS || secrets.ALIAS }}
          KEY_PASS_IN: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "Keystore source: repository secret"
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > work.p12 || { echo "::error::The keystore secret is not valid base64"; exit 1; }
          else
            echo "::warning::No keystore secret found. Using a temporary key, so every update needs an uninstall first."
            keytool -genkeypair -keystore work.p12 -storetype pkcs12 -alias work -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Work App"
            KEY_ALIAS_IN=work
            KEY_PASS_IN=
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          ARGS=(--ks work.p12 --ks-pass env:KS_PASS)
          if [ -n "$KEY_ALIAS_IN" ]; then ARGS+=(--ks-key-alias "$KEY_ALIAS_IN"); fi
          if [ -n "$KEY_PASS_IN" ]; then ARGS+=(--key-pass env:KEY_PASS_IN); fi
          $BT/apksigner sign "${ARGS[@]}" --out work-release.apk aligned.apk
          $BT/apksigner verify work-release.apk
          echo "Signed OK"

      - uses: actions/upload-artifact@v4
        with:
          name: work-apk-release
          path: work-release.apk
