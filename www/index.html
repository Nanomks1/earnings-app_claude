<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>العمل</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--card2:#f6f7f9;--text:#1b1f24;--mut:#6b7280;--pri:#2c6e69;--pri2:#4a8a84;--onpri:#fff;--pritx:#2c6e69;--tint:rgba(44,110,105,.12);--prish:0 12px 24px -10px rgba(44,110,105,.55);--pos:#15803d;--neg:#b91c1c;--ntint:rgba(185,28,28,.1);--bd:#e5e8ec;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1113;--card:#171b1f;--card2:#1d2227;--text:#eceff2;--mut:#9aa3ad;--pos:#6fc79a;--neg:#e58f8f;--ntint:rgba(229,143,143,.14);--bd:#2a3036;--sh:none}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s,background .2s,opacity .2s}
button:active{transform:scale(.97)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px}
h1{font-size:22px;margin:0;font-weight:800}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);display:grid;place-items:center}
.total{position:relative;overflow:hidden;margin:0 16px;padding:20px 18px 16px;border-radius:22px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);box-shadow:var(--prish)}
.total::before{content:"";position:absolute;inset-inline-end:-46px;top:-56px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.09)}
.total::after{content:"";position:absolute;inset-inline-start:-30px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06)}
.total>*{position:relative;z-index:1}
.total .tl{font-size:14px;opacity:.85}
.total .big{font-size:38px;font-weight:800;margin:4px 0 14px;direction:ltr;text-align:right;letter-spacing:-.5px}
.mini{display:grid;grid-template-columns:repeat(var(--n,2),1fr);border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
.mini>div{text-align:center;padding:0 4px}
.mini>div+div{border-inline-start:1px solid rgba(255,255,255,.2)}
.mini .k{display:block;font-size:12px;opacity:.8;margin-bottom:3px}
.mini .v{display:block;font-size:15px;font-weight:700;direction:ltr}
.shift{margin:12px 16px 0}
.clock{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;border:1px dashed var(--pri);background:var(--card);text-align:start}
.bub{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--pritx);flex:none}
.bub.neg{background:var(--ntint);color:var(--neg)}
.clock b{display:block;font-size:15px}
.clock small,.open small{font-size:12px;color:var(--mut)}
.open{background:var(--card);border:1px solid var(--pri);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.open .top{display:flex;align-items:center;gap:10px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 0 var(--pos);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.open .top b{flex:1;font-size:15px}
.open .el{font-size:22px;font-weight:800;direction:ltr}
.open .btns{display:flex;gap:8px;margin-top:12px}
.open .btns button{height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
.open .btns #clockOut{flex:1;background:var(--pri);color:var(--onpri);border:0}
.open .btns #clockCancel{width:48px}
.pay{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 16px 0;width:calc(100% - 32px);height:48px;border-radius:16px;border:1px solid var(--pri);background:var(--card);color:var(--text);font-weight:700;font-size:15px}
.pay .ic{color:var(--pritx)}
.tabs{display:flex;gap:4px;margin:14px 16px 0;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border:0;border-radius:12px;background:none;font-weight:600;color:var(--mut);font-size:14px}
.tabs button .ic{width:17px;height:17px}
.tabs button.on{background:var(--pri);color:var(--onpri)}
.list{padding:8px 16px 0;display:flex;flex-direction:column;gap:8px}
.wk{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 2px;font-size:12.5px;color:var(--mut);font-weight:600}
.wk b{direction:ltr;font-weight:700}
.item{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;width:100%;text-align:start;box-shadow:var(--sh)}
.item .d{font-size:15px;font-weight:700}
.item .m{font-size:12.5px;color:var(--mut);margin-top:2px}
.amt{font-size:16px;font-weight:800;direction:ltr;white-space:nowrap;min-width:84px;text-align:right}
.amt.p{color:var(--pos)}.amt.n{color:var(--neg)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--mut);padding:36px 10px;font-size:14px;line-height:1.7}
.empty .bub{width:54px;height:54px;border-radius:50%}
.empty .ic{width:24px;height:24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.seg{display:flex;gap:4px;padding:4px;background:var(--card2);border-radius:14px}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--pri);color:var(--onpri)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dates>div{min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card2);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.stat .bub{width:34px;height:34px;border-radius:10px}
.stat .bub .ic{width:18px;height:18px}
.stat .sv{font-size:20px;font-weight:800;direction:ltr;line-height:1.1}
.stat .sv small{font-size:12px;font-weight:600;color:var(--mut);margin-inline-start:3px}
.stat .sl{font-size:12px;color:var(--mut)}
.stat.cr .sv{color:var(--neg)}
.stat.net{grid-column:1/-1;background:var(--tint)}
.stat.net .sv{font-size:26px}
.chart .ch{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:12px}
.chart .ch span{font-size:12.5px;color:var(--mut)}
.bars{display:flex;gap:6px;align-items:flex-end;height:128px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.bars .bv{font-size:11px;color:var(--mut);height:14px;line-height:14px;direction:ltr}
.bars i{display:block;width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--tint);min-height:3px}
.bars .b.today i{background:var(--pri)}
.bars .b.has i{background:var(--pritx);opacity:.55}
.bars .b.today.has i{opacity:1;background:var(--pri)}
.bars .bd{font-size:11px;color:var(--mut);white-space:nowrap}
.bars .b.today .bd{color:var(--text);font-weight:700}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{height:48px;border-radius:14px;border:1px solid var(--bd);background:var(--card2);flex:1;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.acts .ok{background:var(--pri);color:var(--onpri);border:0}
.acts .del{color:var(--neg)}
.bar{position:fixed;inset-inline:0;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd)}
.bar button{flex:1;height:52px;border-radius:16px;border:0;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.add{background:var(--pri);color:var(--onpri);box-shadow:var(--prish)}
.adv{background:var(--card);border:1px solid var(--neg)!important;color:var(--neg)}
dialog{border:0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--card);color:var(--text);margin:auto 0 0;border-radius:24px 24px 0 0;animation:up .25s ease-out}
@media (min-width:520px){dialog{margin:auto;border-radius:24px}}
dialog::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--bd);margin:4px auto 12px}
dialog::backdrop{background:rgba(0,0,0,.5);animation:fd .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fd{from{opacity:0}}
dialog h2{margin:0 0 10px;font-size:19px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password]{display:block;width:100%;min-width:0;height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--text);font:inherit;font-size:16px}
input:focus{outline:2px solid var(--pri);outline-offset:-1px}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;width:46px;height:28px;border-radius:14px;background:var(--bd);flex:none;transition:background .2s;margin:0}
input[type=checkbox]::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=checkbox]:checked{background:var(--pri)}
input[type=checkbox]:checked::after{inset-inline-start:21px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:15px;color:var(--text)}
.note{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.7}
.info{font-size:14px;margin:8px 0;line-height:1.7}
.big2{font-weight:800;font-size:18px}
.grp{background:var(--card2);border-radius:16px;padding:4px 12px;margin-top:12px}
.grp .fld{padding:2px 0 8px}
.rb{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 0;border:0;border-bottom:1px solid var(--bd);background:none;text-align:start;font-size:15px}
.rb:last-child{border-bottom:0}
.rb .ic{color:var(--pritx)}
.rb span{flex:1}
.rb em{font-style:normal;font-size:13px;color:var(--mut)}
.sw{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:4px}
.sw button{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid var(--card2);box-shadow:0 0 0 1px var(--bd)}
.sw button.sel{box-shadow:0 0 0 2.5px var(--text)}
.sw input[type=color]{width:44px;height:34px;padding:0;border:0;background:none;border-radius:8px}
#filesList button{display:block;width:100%;text-align:start;padding:12px;margin-top:8px;border-radius:12px;border:1px solid var(--bd);background:var(--card2)}
#filesList small{color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut);padding:4px 0}
.kv b{color:var(--text);direction:ltr;text-align:left}
details.card summary{display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary div{flex:1}
details.card summary b{font-size:15px}
details.card summary small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
details.card .lines{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px;font-size:13px;color:var(--mut);line-height:1.9}
#toast{position:fixed;inset-inline:16px;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:12px 14px;border-radius:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;font-size:14px}
#toast.on{opacity:1}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#lock .dots{display:flex;gap:14px;direction:ltr}
#lock .dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}
#lock .dots span.on{background:var(--pri)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr}
#lock .pad button{height:72px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:24px}
#lock.shake .dots{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l10.5 6.5L8 18.5z"/></symbol><symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M9 3.5v4M15 3.5v4"/></symbol><symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2.5"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 12h.01M17.5 12h.01"/></symbol><symbol id="i-mcircle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/></symbol><symbol id="i-tcircle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="M8.1 11l7.8-3.9M8.1 13l7.8 3.9"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol><symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v10M8 10.5l4 4 4-4M5 19h14"/></symbol><symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5M4 4.5V8h3.5"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v11.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z"/><path d="M13.5 3.5V8H18"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol><symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-5"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol><symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="4.5" rx="1.2"/><path d="M5 9.5V18a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 18V9.5M10 13h4"/></symbol></svg>
<header>
  <h1>العمل</h1>
  <button class="round" id="menuBtn" aria-label="الإعدادات"><svg class="ic"><use href="#i-sliders"/></svg></button>
</header>

<section class="total">
  <div class="tl">المجموع الكامل</div>
  <div class="big num" id="total">0</div>
  <div class="mini" id="mini"></div>
</section>
<section class="shift" id="shift"></section>
<button class="pay" id="payBtn"><svg class="ic"><use href="#i-tcircle"/></svg>استلمت الدفعة</button>

<nav class="tabs">
  <button class="on" id="tabList"><svg class="ic"><use href="#i-list"/></svg>السجلات</button>
  <button id="tabArc"><svg class="ic"><use href="#i-archive"/></svg>الأرشيف</button>
  <button id="tabSum"><svg class="ic"><use href="#i-bars"/></svg>الملخص</button>
</nav>
<main class="list" id="list"></main>
<main class="list" id="arch" hidden></main>
<main class="list" id="summary" hidden>
  <div class="card">
    <div class="seg" id="sSeg">
      <button data-m="month" class="on">هذا الشهر</button>
      <button data-m="week">آخر 7 أيام</button>
      <button data-m="all">الكل</button>
    </div>
    <div class="dates">
      <div><label for="sFrom" style="margin-top:0">من</label><input type="date" id="sFrom"></div>
      <div><label for="sTo" style="margin-top:0">إلى</label><input type="date" id="sTo"></div>
    </div>
    <div class="stats" id="sumOut"></div>
    <div class="tg"><span>تضمين تفاصيل الأيام في الرسالة</span><input type="checkbox" id="sDetail" checked></div>
    <div class="acts"><button class="ok" id="sShare" type="button"><svg class="ic"><use href="#i-share"/></svg>مشاركة الملخص</button></div>
  </div>
  <div class="card chart" id="chart"></div>
</main>

<div class="bar">
  <button class="add" id="addWork"><svg class="ic"><use href="#i-plus"/></svg>يوم عمل</button>
  <button class="adv" id="addAdv"><svg class="ic"><use href="#i-minus"/></svg>كريدي</button>
</div>

<dialog id="form">
  <h2 id="formTitle"></h2>
  <label for="fDate" style="margin-top:4px">التاريخ</label>
  <input type="date" id="fDate">
  <div id="workFields">
    <div class="row">
      <div><label for="fStart">البداية</label><input type="time" id="fStart"></div>
      <div><label for="fEnd">النهاية</label><input type="time" id="fEnd"></div>
    </div>
    <label for="fBrk">استراحة بالدقائق (اختياري)</label>
    <input type="number" id="fBrk" inputmode="numeric" min="0" placeholder="0">
    <div class="info" id="fDur"></div>
  </div>
  <div id="amtWrap">
    <label for="fAmt">مبلغ الكريدي (يُحسب بالسالب)</label>
    <input type="number" id="fAmt" inputmode="decimal" min="0" step="any" placeholder="0">
  </div>
  <label for="fNote">ملاحظة (اختياري)</label>
  <input type="text" id="fNote">
  <div class="acts">
    <button class="del" id="fDel" type="button">حذف</button>
    <button id="fCancel" type="button">إلغاء</button>
    <button class="ok" id="fSave" type="button">حفظ</button>
  </div>
</dialog>

<dialog id="inDlg">
  <h2>تسجيل دخول العمل</h2>
  <div class="row">
    <div><label for="iDate" style="margin-top:4px">التاريخ</label><input type="date" id="iDate"></div>
    <div><label for="iTime" style="margin-top:4px">وقت الدخول</label><input type="time" id="iTime"></div>
  </div>
  <div class="note">عند الخروج اضغط «خروج» وسيحسب التطبيق المدة والأجرة.</div>
  <div class="acts">
    <button id="iCancel" type="button">إلغاء</button>
    <button class="ok" id="iOk" type="button">حفظ وقت الدخول</button>
  </div>
</dialog>

<dialog id="payDlg">
  <h2>استلام دفعة</h2>
  <div class="info big2" id="pInfo"></div>
  <label for="pDate">تاريخ الاستلام</label>
  <input type="date" id="pDate">
  <label for="pRecv">المبلغ الذي استلمته</label>
  <input type="number" id="pRecv" inputmode="decimal" min="0" step="any">
